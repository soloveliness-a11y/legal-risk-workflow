name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.txt -r requirements/dev.txt

      - name: Compile all scripts
        run: python -m compileall -q scripts

      - name: Bash syntax check
        run: bash -n scripts/first_run.sh

      - name: Skill spec validation
        run: python scripts/tools/validate_skills.py

      - name: Release scan (anonymization / credentials)
        run: python scripts/tools/release_scan.py

      - name: Run test suite
        run: python -m pytest tests/ -q
